<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Backrooms Arcade</title>
    <style>
        :root {
            --bg: #120d08;
            --phone: #17100a;
            --panel: rgba(43, 31, 19, 0.84);
            --text: #fff8e8;
            --muted: #d4be95;
            --gold: #ffc75b;
            --orange: #ff8d4a;
            --green: #93f36d;
            --line: rgba(255, 216, 142, 0.18);
            --shadow: rgba(0, 0, 0, 0.45);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at top left, rgba(255, 199, 91, 0.28), transparent 32%),
                radial-gradient(circle at bottom right, rgba(255, 141, 74, 0.18), transparent 30%),
                repeating-linear-gradient(90deg, rgba(255, 220, 137, 0.08) 0 1px, transparent 1px 72px),
                linear-gradient(135deg, #120d08, #24160a 48%, #0d0b08);
            display: grid;
            place-items: center;
            padding: 28px 14px;
        }

        .phone {
            width: min(100%, 430px);
            min-height: 860px;
            max-height: 940px;
            overflow: hidden;
            position: relative;
            border: 1px solid rgba(255, 221, 156, 0.28);
            border-radius: 38px;
            background:
                linear-gradient(rgba(23, 16, 10, 0.90), rgba(23, 16, 10, 0.96)),
                repeating-linear-gradient(0deg, #d4a44f 0 30px, #efc16a 30px 60px);
            box-shadow: 0 30px 90px var(--shadow), inset 0 0 0 8px rgba(255, 255, 255, 0.03);
        }

        .phone::before {
            content: "";
            position: absolute;
            width: 142px;
            height: 26px;
            left: 50%;
            top: 12px;
            transform: translateX(-50%);
            border-radius: 999px;
            background: #080604;
            z-index: 4;
        }

        .screen {
            height: 100%;
            max-height: 940px;
            overflow-y: auto;
            padding: 52px 18px 92px;
            scrollbar-width: none;
        }

        .screen::-webkit-scrollbar,
        .chips::-webkit-scrollbar {
            display: none;
        }

        .topbar,
        .section-title,
        .meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .topbar {
            margin-bottom: 18px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .orb {
            width: 42px;
            height: 42px;
            border-radius: 16px;
            display: grid;
            place-items: center;
            color: #1a1207;
            font-weight: 900;
            background: linear-gradient(135deg, var(--green), var(--gold));
            box-shadow: 0 0 24px rgba(147, 243, 109, 0.35);
        }

        .muted,
        .brand small,
        .section-title span,
        .card p,
        .stat span {
            color: var(--muted);
        }

        .icon-btn {
            width: 42px;
            height: 42px;
            border: 1px solid var(--line);
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.08);
            color: var(--text);
            font-size: 18px;
        }

        .hero {
            position: relative;
            overflow: hidden;
            border: 1px solid var(--line);
            border-radius: 30px;
            padding: 22px;
            min-height: 250px;
            background:
                linear-gradient(140deg, rgba(255, 199, 91, 0.22), rgba(16, 11, 7, 0.30)),
                repeating-linear-gradient(90deg, rgba(255, 235, 174, 0.12) 0 2px, transparent 2px 38px),
                repeating-linear-gradient(0deg, #b88235 0 44px, #d9a852 44px 88px);
            box-shadow: inset 0 0 60px rgba(0, 0, 0, 0.28);
        }

        .hero::after {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(90deg, transparent 0 32%, rgba(24, 16, 9, 0.72) 32% 34%, transparent 34% 64%, rgba(24, 16, 9, 0.54) 64% 65%, transparent 65%),
                radial-gradient(circle at 78% 18%, rgba(255, 244, 205, 0.45), transparent 22%);
        }

        .hero-content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            justify-content: end;
            min-height: 206px;
        }

        .chip-main,
        .platform {
            width: fit-content;
            color: #241507;
            background: var(--gold);
            border-radius: 999px;
            padding: 7px 11px;
            font-size: 12px;
            font-weight: bold;
        }

        h1 {
            font-size: 46px;
            line-height: 0.95;
            margin: 12px 0 10px;
        }

        .hero p {
            max-width: 310px;
            color: #fff0c6;
            line-height: 1.45;
        }

        .search {
            margin: 18px 0 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 13px 15px;
            border: 1px solid var(--line);
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(14px);
        }

        .search input {
            width: 100%;
            border: 0;
            outline: 0;
            color: var(--text);
            background: transparent;
            font-size: 15px;
        }

        .search input::placeholder {
            color: #bfa87b;
        }

        .chips {
            display: flex;
            gap: 9px;
            overflow-x: auto;
            padding-bottom: 6px;
            scrollbar-width: none;
        }

        .chip {
            flex: 0 0 auto;
            border: 1px solid var(--line);
            border-radius: 999px;
            padding: 10px 14px;
            color: var(--muted);
            background: rgba(255, 255, 255, 0.06);
            cursor: pointer;
        }

        .chip.active {
            color: #1c1207;
            background: var(--green);
            border-color: transparent;
            box-shadow: 0 0 20px rgba(147, 243, 109, 0.22);
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 16px 0 24px;
        }

        .stat {
            border: 1px solid var(--line);
            border-radius: 18px;
            padding: 13px 10px;
            background: rgba(255, 255, 255, 0.07);
        }

        .stat strong {
            display: block;
            color: var(--gold);
            font-size: 21px;
            margin-bottom: 4px;
        }

        .stat span {
            font-size: 12px;
        }

        .section-title {
            align-items: end;
            margin-bottom: 14px;
        }

        .section-title h2 {
            font-size: 23px;
        }

        .grid {
            display: grid;
            gap: 14px;
        }

        .card {
            display: grid;
            grid-template-columns: 92px 1fr;
            gap: 14px;
            align-items: center;
            border: 1px solid var(--line);
            border-radius: 24px;
            padding: 13px;
            background: linear-gradient(135deg, var(--panel), rgba(255, 255, 255, 0.055));
            box-shadow: 0 14px 30px rgba(0, 0, 0, 0.22);
            animation: floatIn 0.45s ease both;
            transition: transform 0.22s ease, border-color 0.22s ease, background 0.22s ease;
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: rgba(255, 199, 91, 0.65);
            background: linear-gradient(135deg, rgba(62, 44, 25, 0.94), rgba(255, 199, 91, 0.10));
        }

        .cover {
            height: 92px;
            position: relative;
            overflow: hidden;
            border-radius: 20px;
            display: grid;
            place-items: center;
            font-size: 34px;
            background:
                linear-gradient(140deg, rgba(255, 255, 255, 0.22), rgba(0, 0, 0, 0.18)),
                repeating-linear-gradient(45deg, #f6c76a 0 18px, #b87934 18px 36px);
        }

        .cover img {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            inset: 0;
            z-index: 1;
        }

        .cover span {
            position: relative;
            z-index: 0;
        }

        .card h3 {
            font-size: 17px;
            margin-bottom: 5px;
        }

        .card p {
            font-size: 13px;
            line-height: 1.35;
            margin-bottom: 9px;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 10px;
        }

        .tag {
            border: 1px solid rgba(255, 216, 142, 0.22);
            border-radius: 999px;
            padding: 5px 8px;
            color: #ffd98c;
            background: rgba(255, 199, 91, 0.08);
            font-size: 11px;
        }

        .level {
            color: var(--green);
            font-size: 12px;
            font-weight: bold;
        }

        .loader {
            margin: 18px auto 0;
            width: fit-content;
            color: var(--muted);
            font-size: 13px;
        }

        .bottom-nav {
            position: absolute;
            left: 18px;
            right: 18px;
            bottom: 18px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            border: 1px solid var(--line);
            border-radius: 26px;
            padding: 10px;
            background: rgba(22, 15, 9, 0.86);
            backdrop-filter: blur(18px);
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.36);
        }

        .nav-item {
            border: 0;
            border-radius: 18px;
            padding: 9px 4px;
            color: var(--muted);
            background: transparent;
            font-size: 12px;
        }

        .nav-item.active {
            color: #1d1308;
            background: var(--gold);
            font-weight: bold;
        }

        @keyframes floatIn {
            from {
                opacity: 0;
                transform: translateY(14px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 520px) {
            body {
                padding: 0;
                display: block;
            }

            .phone {
                width: 100%;
                min-height: 100vh;
                max-height: none;
                border: 0;
                border-radius: 0;
            }

            .screen {
                max-height: none;
                min-height: 100vh;
            }
        }
    </style>
</head>
<body>
    <main class="phone">
        <section class="screen" id="screen">
            <div class="topbar">
                <div class="brand">
                    <div class="orb">X</div>
                    <div>
                        <strong>Backrooms Arcade</strong><br>
                        <small>Catalogo infinito</small>
                    </div>
                </div>
                <button class="icon-btn">⌁</button>
            </div>

            <section class="hero">
                <div class="hero-content">
                    <span class="chip-main">Nivel destacado</span>
                    <h1>Lost Rooms</h1>
                    <p>Explora una app de juegos con pasillos infinitos, etiquetas y tarjetas listas para tus imagenes.</p>
                </div>
            </section>

            <label class="search">
                <span>⌕</span>
                <input id="search" type="text" placeholder="Buscar juego, plataforma o etiqueta">
            </label>

            <div class="chips" id="chips">
                <button class="chip active" data-filter="todos">Todos</button>
                <button class="chip" data-filter="Terror">Terror</button>
                <button class="chip" data-filter="Exploracion">Exploracion</button>
                <button class="chip" data-filter="Puzzle">Puzzle</button>
                <button class="chip" data-filter="Multijugador">Multijugador</button>
                <button class="chip" data-filter="PC">PC</button>
                <button class="chip" data-filter="Xbox">Xbox</button>
            </div>

            <section class="stats">
                <article class="stat"><strong id="count">10</strong><span>visibles</span></article>
                <article class="stat"><strong>∞</strong><span>scroll</span></article>
                <article class="stat"><strong>10</strong><span>base</span></article>
            </section>

            <div class="section-title">
                <div>
                    <h2>Catalogo infinito</h2>
                    <span>Las tarjetas se cargan al bajar</span>
                </div>
                <span class="muted">v2</span>
            </div>

            <section class="grid" id="grid"></section>
            <p class="loader" id="loader">Baja para cargar mas juegos...</p>
        </section>

        <nav class="bottom-nav">
            <button class="nav-item active">Inicio</button>
            <button class="nav-item">Buscar</button>
            <button class="nav-item">Tags</button>
            <button class="nav-item">Perfil</button>
        </nav>
    </main>

    <script>
        // Para agregar tus imagenes: guarda archivos en la carpeta "imagenes"
        // y cambia el valor de imagen. Ejemplo: imagen: "imagenes/mi-juego.jpg"
        const juegos = [
            { titulo: 'Escape the Backrooms', plataforma: 'PC', nivel: 'Nivel 0', icono: '🟨', imagen: 'imagenes/escape-backrooms.jpg', descripcion: 'Pasillos amarillos, rutas secretas y una salida casi imposible.', etiquetas: ['Terror', 'Exploracion'] },
            { titulo: 'Inside the Rooms', plataforma: 'Xbox', nivel: 'Nivel 1', icono: '🚪', imagen: 'imagenes/inside-rooms.jpg', descripcion: 'Habitaciones repetidas con pistas ocultas y ambiente misterioso.', etiquetas: ['Terror', 'Puzzle'] },
            { titulo: 'VHS Hallways', plataforma: 'PlayStation', nivel: 'Nivel 2', icono: '📼', imagen: 'imagenes/vhs-hallways.jpg', descripcion: 'Exploracion con efecto cinta antigua y luces fluorescentes.', etiquetas: ['Terror', 'Retro'] },
            { titulo: 'Fluorescent Maze', plataforma: 'Xbox', nivel: 'Nivel 3', icono: '💡', imagen: 'imagenes/fluorescent-maze.jpg', descripcion: 'Laberintos calidos con paredes que parecen cambiar de lugar.', etiquetas: ['Puzzle', 'Exploracion'] },
            { titulo: 'Level Elevator', plataforma: 'PC', nivel: 'Nivel 4', icono: '🛗', imagen: 'imagenes/level-elevator.jpg', descripcion: 'Sube por niveles nuevos y desbloquea puertas imposibles.', etiquetas: ['Puzzle', 'Aventura'] },
            { titulo: 'No Clip Runner', plataforma: 'Xbox', nivel: 'Nivel 5', icono: '🧭', imagen: 'imagenes/no-clip-runner.jpg', descripcion: 'Corre contra el tiempo atravesando zonas fuera de la realidad.', etiquetas: ['Accion', 'Multijugador'] },
            { titulo: 'Warm Liminal', plataforma: 'Mobile', nivel: 'Nivel 6', icono: '🟧', imagen: 'imagenes/warm-liminal.jpg', descripcion: 'Salas vacias, color dorado y sonidos suaves de fondo.', etiquetas: ['Exploracion', 'Relax'] },
            { titulo: 'Hotel Endless', plataforma: 'PC', nivel: 'Nivel 7', icono: '🕯️', imagen: 'imagenes/hotel-endless.jpg', descripcion: 'Un hotel infinito con alfombras viejas y pasillos elegantes.', etiquetas: ['Terror', 'Aventura'] },
            { titulo: 'Signal Lost', plataforma: 'PlayStation', nivel: 'Nivel 8', icono: '📡', imagen: 'imagenes/signal-lost.jpg', descripcion: 'Busca senales de radio para encontrar rutas escondidas.', etiquetas: ['Puzzle', 'Exploracion'] },
            { titulo: 'The Last Exit', plataforma: 'Xbox', nivel: 'Final', icono: '🕳️', imagen: 'imagenes/the-last-exit.jpg', descripcion: 'La ultima salida esta cerca, pero el mapa ya no responde.', etiquetas: ['Terror', 'Multijugador'] }
        ];

        const screen = document.querySelector('#screen');
        const grid = document.querySelector('#grid');
        const search = document.querySelector('#search');
        const chips = document.querySelectorAll('.chip');
        const count = document.querySelector('#count');
        let filtroActivo = 'todos';
        let pagina = 0;
        const porPagina = 10;

        function crearTarjeta(juego, vuelta) {
            const tags = juego.etiquetas.map(tag => `<span class="tag">${tag}</span>`).join('');
            return `
                <article class="card" data-platform="${juego.plataforma}" data-tags="${juego.etiquetas.join(' ')}" data-name="${juego.titulo}">
                    <div class="cover">
                        <img src="${juego.imagen}" alt="${juego.titulo}" onerror="this.remove()">
                        <span>${juego.icono}</span>
                    </div>
                    <div>
                        <h3>${juego.titulo}</h3>
                        <p>${juego.descripcion}</p>
                        <div class="tags">${tags}</div>
                        <div class="meta"><span class="platform">${juego.plataforma}</span><span class="level">${juego.nivel} · Loop ${vuelta}</span></div>
                    </div>
                </article>`;
        }

        function cargarMas() {
            const vuelta = pagina + 1;
            const tarjetas = juegos.slice(0, porPagina).map(juego => crearTarjeta(juego, vuelta)).join('');
            grid.insertAdjacentHTML('beforeend', tarjetas);
            pagina++;
            filtrarTarjetas();
        }

        function filtrarTarjetas() {
            const texto = search.value.toLowerCase();
            const tarjetas = document.querySelectorAll('.card');
            let visibles = 0;

            tarjetas.forEach(card => {
                const nombre = card.dataset.name.toLowerCase();
                const plataforma = card.dataset.platform.toLowerCase();
                const tags = card.dataset.tags.toLowerCase();
                const coincideTexto = nombre.includes(texto) || plataforma.includes(texto) || tags.includes(texto);
                const coincideFiltro = filtroActivo === 'todos' || card.dataset.platform === filtroActivo || card.dataset.tags.includes(filtroActivo);
                const mostrar = coincideTexto && coincideFiltro;

                card.style.display = mostrar ? 'grid' : 'none';
                if (mostrar) visibles++;
            });

            count.textContent = visibles;
        }

        chips.forEach(chip => {
            chip.addEventListener('click', () => {
                chips.forEach(item => item.classList.remove('active'));
                chip.classList.add('active');
                filtroActivo = chip.dataset.filter;
                filtrarTarjetas();
            });
        });

        screen.addEventListener('scroll', () => {
            const cercaDelFinal = screen.scrollTop + screen.clientHeight >= screen.scrollHeight - 120;
            if (cercaDelFinal) cargarMas();
        });

        search.addEventListener('input', filtrarTarjetas);
        cargarMas();
    </script>
</body>
</html>
